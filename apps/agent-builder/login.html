<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · AI Conversation Agent · iMocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{color-scheme:light;--bg:#FAFAFD;--white:#fff;--ink:#14142B;--ink-3:#3D4058;--muted:#4A4D63;--muted-2:#5E6278;--line:#ECEDF3;--field:#DEDFE8;--accent:#7F56D9;--accent-ink:#6941C6;--soft:#F4EBFF;--bad:#B8392A;--bad-bg:#FBE9E6;--display:Poppins,"Helvetica Neue",Helvetica,sans-serif;--body:"DM Sans","Helvetica Neue",Helvetica,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.bmark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:700;font-size:14px}
.bname{display:flex;flex-direction:column;line-height:1.05}
.bname b{font-family:var(--display);font-weight:700;font-size:19px}
.bname small{font-size:11px;color:var(--muted-2);letter-spacing:.02em}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(105,65,198,.06)}
h1{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
form{margin-top:22px;display:flex;flex-direction:column;gap:16px}
label span{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
input{width:100%;height:44px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:var(--white);font:inherit;color:var(--ink)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
button{height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover:not(:disabled){background:var(--accent-ink)}
button:disabled{background:var(--field);color:#8a8da3;cursor:not-allowed}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <div class="bmark" aria-hidden="true">iM</div>
    <div class="bname"><b>iMocha</b><small>AI Conversation Agent</small></div>
  </div>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Use your work account to open the Agent Builder.</p>
    <form id="f" novalidate>
      <label><span>Work email</span>
        <input id="email" type="email" name="email" autocomplete="username" required autofocus></label>
      <label><span>Password</span>
        <input id="password" type="password" name="password" autocomplete="current-password" required></label>
      <p id="err" class="err" role="alert" hidden></p>
      <button id="go" type="submit" disabled>Sign in</button>
    </form>
  </div>
</main>
<script>
(function () {
  var f = document.getElementById('f'), email = document.getElementById('email'),
      pw = document.getElementById('password'), go = document.getElementById('go'),
      err = document.getElementById('err');
  function sync() { go.disabled = !email.value.trim() || !pw.value; }
  email.addEventListener('input', sync);
  pw.addEventListener('input', sync);
  sync();
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (go.disabled) return;
    go.disabled = true; go.textContent = 'Signing in…'; err.hidden = true;
    fetch('/api/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value.trim(), password: pw.value })
    }).then(function (r) {
      if (r.ok) { window.location.reload(); return; }
      err.textContent = r.status === 429
        ? 'Too many attempts. Wait a minute and try again.'
        : "That email and password don't match an account.";
      err.hidden = false; pw.value = ''; go.textContent = 'Sign in'; sync(); pw.focus();
    }).catch(function () {
      err.textContent = "Can't reach the server. Try again.";
      err.hidden = false; go.textContent = 'Sign in'; sync();
    });
  });
})();
</script>
</body>
</html>
